name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1

      - uses: pnpm/action-setup@v6.1.0

      - uses: actions/setup-node@v7.1.0
        with:
          node-version: 26.12.1
          cache: pnpm

      # Named on purpose: this is the same install the release job runs first, so a lockfile that
      # drifted from a package.json fails HERE with an obvious label rather than deep inside a
      # release. It cannot be the only guard, though — the changesets "version packages" PR is
      # opened with GITHUB_TOKEN, and GitHub does not run `pull_request` workflows for those, so a
      # drift introduced by versioning is only seen by this workflow's `push: master` run, after the
      # merge. The prevention lives in the root `version-packages` script, which regenerates the
      # lockfile as part of versioning so that PR is self-consistent by construction.
      - name: Install (lockfile must be up to date)
        run: pnpm install --frozen-lockfile

      - run: pnpm lint

      - run: pnpm typecheck

      - run: pnpm build

  # The test suite runs on every Node line the packages support (`engines.node: ">=24"`): the
  # lines Node maintains that AdonisJS 7 supports, the 24 LTS and the current 26. Lint, typecheck and build above stay on the
  # single pinned version — they do not depend on the runtime, so the matrix only multiplies this.
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [24, 26]
    name: test (node ${{ matrix.node }})
    steps:
      - uses: actions/checkout@v7.0.1

      - uses: pnpm/action-setup@v6.1.0

      - uses: actions/setup-node@v7.1.0
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # The ffmpeg engines' real-binary tests skip when ffmpeg is absent, so CI installs it — as a
      # static build from GitHub releases (includes libx264) rather than apt: the runner's apt
      # repeatedly stalled this step past its timeout. The timeout turns any stall into a fast,
      # re-runnable failure.
      - name: Install ffmpeg (static build)
        timeout-minutes: 5
        run: |
          curl -fsSL --retry 3 https://github.com/BtbN/FFmpeg-Builds/releases/download/latest/ffmpeg-master-latest-linux64-gpl.tar.xz \
            | tar -xJ -C "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/ffmpeg-master-latest-linux64-gpl/bin" >> "$GITHUB_PATH"

      - run: pnpm test
