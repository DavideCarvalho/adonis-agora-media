# Domain map for adonis-media (TanStack Intent agent skills).
# Produced autonomously (fully-autonomous constraint — NO maintainer interview was run;
# gaps are recorded in _artifacts/skill_spec.md). Grounded in README.md, REVIEW.md,
# docs/**, and packages/{adonis,react,dashboard}/{src,package.json}.

library:
  name: adonis-media
  version: 0.12.1
  repository: 'https://github.com/DavideCarvalho/adonis-agora-media'
  description: >-
    Media-library for AdonisJS (the spatie/laravel-media-library feel) on top of
    @adonisjs/drive: owner collections with MIME/content policy, column attachments,
    eager/lazy image conversions, pluggable content transformers (HLS via mediabunny),
    proxy/direct-S3/resumable-TUS uploads, configurable delivery, an embedded management
    console, and a React upload client.
  primary_framework: AdonisJS

# Versions read from packages/*/package.json at scaffolding time.
versions:
  '@adonis-agora/media': 0.12.1
  '@adonis-agora/media-react': 0.5.0
  '@adonis-agora/media-dashboard': 8.0.0

primary_packages:
  - name: '@adonis-agora/media'
    dir: packages/adonis
    role: Core library — defineConfig, MediaManager (library/attachments/uploads/
      resumable/direct accessors), MediaStore + ImageProcessor + Disk SPIs, bundled
      disks.s3()/processors.sharp()/transformers.hls()+probe(), delivery handlers,
      embedded dashboard provider, testing kit.
  - name: '@adonis-agora/media-react'
    dir: packages/react
    role: Browser companion — useMediaUpload, MediaUploader, framework-free
      createMediaUploadClient (./client), console launcher (OpenMediaDashboardButton).
  - name: '@adonis-agora/media-dashboard'
    dir: packages/dashboard
    role: Standalone management console (React SPA build source + thin delegate
      provider). The console ships embedded in @adonis-agora/media; this package is
      the legacy/explicit-install variant.

# The mental model an AI agent must hold to use the library correctly.
concepts:
  - id: agora-config-idiom
    summary: >-
      Drivers live in the core package and are selected BY NAME from factory maps
      (stores / processors / disks / uploadSessions / transformers). Every factory is a
      lazy thunk — the heavy optional peer (@adonisjs/lucid, sharp, @aws-sdk/client-s3,
      mediabunny) is imported only when its driver is SELECTED at boot.
    source: docs/configuration.mdx, packages/adonis/src/define_config.ts
  - id: manager-and-layers
    summary: >-
      The provider binds one singleton MediaManager; reach it with
      `import media from '@adonis-agora/media/services/main'` or DI. Accessors:
      media.library (owner collections), media.attachments (column attachments),
      media.disk(name?) escape hatch, media.store (cross-owner reads),
      media.uploads / media.resumable / media.direct (opt-in upload coordinators),
      media.collections registry.
    source: docs/getting-started.mdx, packages/adonis/src/media_manager.ts
  - id: disk-precedence
    summary: >-
      Which disk a write targets: per-call disk > collection disk > top-level disk >
      Drive default. Where the NAME resolves: the config's own `disks` map FIRST, then
      @adonisjs/drive. Locally-configured disks win by name; Drive is read lazily.
    source: docs/configuration.mdx, packages/adonis/src/disks/drive.ts
  - id: collection-policy
    summary: >-
      A collection is the policy layer: acceptsMimeTypes (exact-match whitelist +
      magic-byte content verification, closed vs open whitelist), single:true atomic
      replace, append-only ordering, per-collection disk, conversion presets +
      transformers sharing ONE record.conversions namespace (collision = boot-time
      TransformerConflictError). Undeclared collections are permissive by default.
    source: docs/collections-and-conversions.mdx, docs/single-file.mdx
  - id: conversions-vs-transformers
    summary: >-
      ConversionPreset are IMAGE-only (sharp), eager on attach or lazy on first
      url(id, name) then cached. Transformers (hls/probe/yours) persist into the same
      conversions map but NEVER generate on read — url()/deliver() throw
      TransformNotReadyError until transform() runs (usually from a job).
    source: docs/collections-and-conversions.mdx, docs/transformers.mdx
  - id: attachments-value-object
    summary: >-
      AttachmentManager is the adonis-attachment shape: one file on a model JSON
      column, no owner, no extra table. Variants are ALWAYS eager (no record to cache
      lazy results onto). Persist att.toJSON(); rebuild with Attachment.fromJSON().
      delete() removes disk objects but never touches your column.
    source: docs/attachments.mdx, packages/adonis/src/attachment.ts
  - id: spi-seams
    summary: >-
      Three pluggable seams: MediaStore (save/find/listByOwner/list/delete/nextOrder —
      list is the cross-owner keyset-paginated read the dashboard needs), ImageProcessor
      (one convert method), and the structural Disk contract (8 required methods;
      putStream + getVisibility unlock streaming writes and delivery auto). Detected
      structurally: MultipartUploadDisk and ExtendedDisk (disks.s3() implements both).
    source: docs/stores-and-processors.mdx, docs/storage/s3-disk.mdx
  - id: upload-strategies
    summary: >-
      proxy (any disk, bytes through the app), direct (presigned multipart part URLs,
      multipart-capable disk only — forcing it elsewhere throws UploadNotSupportedError),
      resumable TUS (byte-offset resume), direct SESSIONS (part-granular resume, state
      persisted in an UploadSessionStore shared with TUS). Raw upload methods write
      bytes ONLY — no MediaRecord exists until attach/attachExisting adopts the key.
    source: docs/uploads/upload-modes.mdx, docs/uploads/resumable-tus.mdx, docs/uploads/direct-sessions.mdx
  - id: policy-seam
    summary: >-
      DirectUploadPolicy owns every app-specific decision: onInitiate returns the
      SERVER-computed key (keyFor is never called when a policy exists),
      resolveComplete targets attachExisting, onComplete's return value IS the response
      body, mapError gets first refusal. Handlers perform NO authorization.
    source: docs/uploads/direct-upload-policy.mdx
  - id: delivery-strategy
    summary: >-
      delivery.mode auto|public|signed|proxy for reads; auto asks the disk's
      getVisibility (unknown => signed, NEVER inferred from getUrl; auto never picks
      proxy). MediaDeliveryHandler/HlsDeliveryHandler are framework-agnostic — you mount
      the route behind YOUR auth. S3 visibility is declarative, never applied as an ACL.
    source: docs/delivery.mdx, docs/storage/s3-disk.mdx
  - id: browser-client
    summary: >-
      @adonis-agora/media-react speaks the provider's real routes: tusPath
      (/media/uploads/tus), directPath (/media/uploads/direct/sessions), uploadsPath
      (proxy PUT). Keys derive server-side except proxy meta.key; headers/getHeaders go
      to app requests only, never presigned S3 PUTs; MediaHttpError.status separates
      definitive (404/410) from transient failures.
    source: docs/react/index.mdx, docs/react/client.mdx
  - id: console
    summary: >-
      Embedded console (dashboard_provider) + standalone @adonis-agora/media-dashboard
      delegate. Read-only by default; actions:true enables copy/move/delete (gated 403
      in DashboardService). Built-in session auth (Mode A mint-from-app-auth / Mode B
      credentials) composes with host middleware. DashboardService is the framework-free
      engine; deleteMediaRecord deletes the ROW, not the object.
    source: docs/dashboard/index.mdx, docs/dashboard/authentication.mdx, docs/dashboard/programmatic.mdx

domains:
  - id: setup-configuration
    title: Install, configure, and wire the manager
    package: '@adonis-agora/media'
    surface:
      - 'node ace configure @adonis-agora/media (both providers + 2 stub configs + 2 migrations)'
      - 'defineConfig keys: disk, disks, store, stores, imageProcessor, collections, uploads, delivery, attachmentKeyPrefix, emitDiagnostics'
      - "@adonis-agora/media/services/main singleton"
    key_facts:
      - Naming a `store` with no matching factory THROWS StoreNotConfiguredError — never a silent fallback to in-memory.
      - Every factory (stores.lucid/processors.sharp/disks.s3/uploadSessions.lucid/transformers.hls) is a lazy thunk; the optional peer loads only when selected.
      - A media call at module scope hits @adonisjs/drive before boot => DriveNotReadyError.

  - id: library-collections
    title: Owner collections and conversions
    package: '@adonis-agora/media'
    surface:
      - 'media.library.attach / attachExisting / for(ownerType, ownerId)'
      - 'media.library.url / signedUrl / deliver / ensureConversion / transform / find / list / delete'
      - 'MediaCollectionConfig: single, acceptsMimeTypes, disk, conversions, transformers'
      - 'detectMimeType / verifyContentAgainstWhitelist / isClosedSignatureWhitelist'
    key_facts:
      - MIME check is exact-match (no wildcards) BEFORE any write; then magic-byte signature verification (closed whitelists reject unrecognized bytes).
      - single:true replaces AFTER the new file is safely persisted; without it attach APPENDS (ordering is append-only).
      - Converting needs imageProcessor — ImageProcessorMissingError otherwise; conversion format defaults to webp.
      - Deterministic `id` makes retries overwrite in place instead of orphaning new UUID keys.

  - id: attachments-single-file
    title: Column attachments and the single-file seam
    package: '@adonis-agora/media'
    surface:
      - 'media.attachments.createFromFile / url / signedUrl / delete'
      - 'Attachment.toJSON / Attachment.fromJSON; AttachmentData variants/meta'
      - '@adonis-agora/media/single-file: storeSingleFile / removeSingleFile / *With / isSingleFileStoreAvailable'

  - id: storage-delivery
    title: Storage SPIs, S3 disk, and delivery
    package: '@adonis-agora/media'
    surface:
      - 'MediaStore SPI + stores.memory()/lucid(); ImageProcessor + processors.sharp()'
      - 'Disk contract, DiskResolver, StorageManager, createDriveBackedResolver, disks.s3(), presignS3Url'
      - 'delivery.mode auto|public|signed|proxy; MediaDeliveryHandler; HlsDeliveryHandler; library.deliver()'
      - '@adonis-agora/media/testing doubles'
    key_facts:
      - createDriveBackedResolver needs the drive SERVICE MODULE NAMESPACE (import * as), not a captured default export.
      - s3 `visibility` is declarative (never probed, never applied as ACL); delivery auto asks getVisibility and degrades to signed when unknown.
      - Delivery/upload handlers perform NO authorization — mounting them unguarded publishes every record.

  - id: uploads-resumable
    title: Large-file uploads (proxy, direct-S3, TUS, policies)
    package: '@adonis-agora/media'
    surface:
      - 'uploads.{mode,partSize,presignTtlSeconds,routes}; media.uploads.initiateDirectUpload/completeDirectUpload/abortDirectUpload/proxyUpload'
      - 'uploads.resumable + media.resumable (createUpload/writeChunk/status/complete/abort/list/listParts); TusUploadHandler'
      - 'uploads.direct + media.direct (initiate/confirmPart/status/complete/abort); DirectUploadPolicy; completeDirectUploadToLibrary / completeUploadToLibrary'
    key_facts:
      - Routes are opt-in and unguarded by design — routes.middleware (+ policy hooks) are the only gates.
      - Bucket CORS MUST expose ETag or direct uploads cannot confirm parts (the most common direct-upload misconfiguration).
      - Adopt finished uploads with attachExisting/complete*ToLibrary — never re-read bytes into attach().

  - id: react-uploads
    title: React/browser upload client
    package: '@adonis-agora/media-react'
    surface:
      - 'useMediaUpload({mode}) -> upload/pause/resume/abort/reset, status, progress, resumable'
      - 'MediaUploader (render prop headless); createMediaUploadClient (./client, framework-free)'
      - 'OpenMediaDashboardButton / useOpenMediaDashboard / openMediaDashboard; ConsoleSessionError redirect trap'

  - id: dashboard-console
    title: Management console (embedded + standalone)
    package: '@adonis-agora/media-dashboard'
    surface:
      - 'config/media_dashboard.ts: basePath, apiBasePath, actions, disks, middleware, enabled, auth, objectInsights'
      - 'auth.session (Mode A) / auth.login (Mode B) / revalidate; signSessionCookie / verifySessionCookie / resolveConsoleAuth'
      - 'DashboardService + DashboardError + MediaManagerLike; JSON contract types (@adonis-agora/media-dashboard/types)'

