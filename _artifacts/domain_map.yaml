failure_modes:
  - mistake: expecting a silent in-memory fallback for an unconfigured store
    mechanism: Provider throws StoreNotConfiguredError at boot when `store` names a missing `stores` entry — a typo must not swap durable persistence for a process-local Map.
    source: docs/configuration.mdx (How the provider builds it), docs/errors.mdx
    priority: HIGH
    skills: [media-setup]
  - mistake: calling the media singleton at module scope before Drive boots
    mechanism: A disk resolution that reaches @adonisjs/drive before its manager boots throws DriveNotReadyError — almost always a media call at module scope instead of inside a request/app.booted.
    source: docs/errors.mdx, docs/stores-and-processors.mdx
    priority: CRITICAL
    skills: [media-setup]
  - mistake: selecting lucid/sharp/s3 without installing the optional peer or migration
    mechanism: Factory thunks import heavy peers only when selected; selecting stores.lucid() without the published migration fails on first attach, not at configure time.
    source: docs/getting-started.mdx, docs/configuration.mdx
    priority: HIGH
    skills: [media-setup]
  - mistake: importing dashboard defineConfig into config/media.ts (or vice versa)
    mechanism: Both `@adonis-agora/media` and `@adonis-agora/media/dashboard` export a `defineConfig`; the wrong one types the wrong config file and silently drops keys.
    source: README.md subpath table, docs/dashboard/index.mdx
    priority: MEDIUM
    skills: [media-setup]
  - mistake: requesting conversions with no imageProcessor configured
    mechanism: Asking for any conversion (or declaring eager ones) with no processor throws ImageProcessorMissingError rather than silently skipping.
    source: docs/getting-started.mdx warn callout, docs/configuration.mdx
    priority: HIGH
    skills: [media-library-collections]
  - mistake: using wildcard MIME types in acceptsMimeTypes
    mechanism: The whitelist is an exact string match — 'image/*' matches nothing, so every attach throws MimeNotAllowedError before any write.
    source: docs/collections-and-conversions.mdx (MIME whitelist)
    priority: HIGH
    skills: [media-library-collections]
  - mistake: assuming attach replaces an existing file without single:true
    mechanism: Replacement is a property of the COLLECTION; without single:true each attach appends a new record (append-only order), so "the avatar" quietly becomes a growing list.
    source: docs/collections-and-conversions.mdx, docs/single-file.mdx warn callout
    priority: CRITICAL
    skills: [media-library-collections, media-attachments-single-file]
  - mistake: reading url() on a transformer conversion expecting lazy generation
    mechanism: Image presets generate lazily on first read, but reads NEVER generate transforms — url()/deliver() throw TransformNotReadyError until transform(id, name) runs.
    source: docs/transformers.mdx (Reads never generate a transform)
    priority: CRITICAL
    skills: [media-library-collections]
  - mistake: declaring conversion presets on a non-image collection
    mechanism: Presets decode through sharp (image-only); requesting one for a video/PDF fails inside sharp — transformers are the seam for non-image derivations.
    source: docs/collections-and-conversions.mdx warn callout
    priority: HIGH
    skills: [media-library-collections]
  - mistake: trusting the declared mimeType as the real content type
    mechanism: With acceptsMimeTypes present the library verifies magic-byte signatures; a renamed file throws ContentTypeMismatchError even though the declared type is whitelisted.
    source: docs/collections-and-conversions.mdx (The content is checked too)
    priority: HIGH
    skills: [media-library-collections]
  - mistake: requesting attachment variants that were not declared up front
    mechanism: Variants are always eager (no record to cache lazy results onto); asking for an ungenerated variant throws VariantNotFoundError.
    source: docs/attachments.mdx (Variants are eager, Resolving URLs)
    priority: HIGH
    skills: [media-attachments-single-file]
  - mistake: leaving the model column populated after attachments.delete()
    mechanism: delete() removes disk objects only — a stale column keeps resolving URLs to deleted objects until you clear and save the model yourself.
    source: docs/attachments.mdx (Deleting)
    priority: HIGH
    skills: [media-attachments-single-file]
  - mistake: calling storeSingleFile against a collection that is not single:true
    mechanism: Nothing about the single-file functions enforces replacement — an undeclared/non-single collection appends on every call.
    source: docs/single-file.mdx warn callout
    priority: CRITICAL
    skills: [media-attachments-single-file]
  - mistake: passing the drive service default export instead of the module namespace
    summary: captured-at-import
    mechanism: Drive's service assigns its manager inside app.booted(); a destructured default is frozen undefined forever (=> DriveNotReadyError), while the namespace's live binding reflects the assignment.
    source: docs/stores-and-processors.mdx (createDriveBackedResolver)
    priority: CRITICAL
    skills: [media-stores-delivery]
  - mistake: setting s3 visibility public and expecting an ACL to be applied
    mechanism: visibility is declarative metadata read by delivery auto — it is never probed or enforced; objects stay private unless the bucket policy allows reads.
    source: docs/storage/s3-disk.mdx (visibility option)
    priority: CRITICAL
    skills: [media-stores-delivery]
  - mistake: exposing a delivery route without authorization
    mechanism: MediaDeliveryHandler resolves a media id to bytes/URL and performs NO authorization; mounted unguarded it publishes every record to anyone who can guess an id.
    source: docs/delivery.mdx error callout
    priority: CRITICAL
    skills: [media-stores-delivery]
  - mistake: relying on auto delivery for storage the browser cannot reach
    mechanism: auto resolves to signed (never proxy) and presigns against the configured endpoint — an internal MinIO host needs publicEndpoint or the browser gets unresolvable URLs.
    source: docs/delivery.mdx (auto never picks proxy), docs/storage/s3-disk.mdx (publicEndpoint)
    priority: HIGH
    skills: [media-stores-delivery]
  - mistake: implementing a custom MediaStore without a working list()
    mechanism: Nothing in attach/url/delete calls list(), so a store that omits or stubs it surfaces only later as EMPTY dashboard collection views.
    source: docs/stores-and-processors.mdx, docs/dashboard/collections.mdx
    priority: MEDIUM
    skills: [media-stores-delivery]
  - mistake: re-reading finished upload bytes through library.attach()
    mechanism: attach buffers and rewrites the object — exactly what resumable uploads exist to avoid; adopt in place with completeUploadToLibrary/completeDirectUploadToLibrary/attachExisting.
    source: docs/uploads/resumable-tus.mdx (Turning a finished upload into a media record)
    priority: CRITICAL
    skills: [media-uploads-resumable]
  - mistake: shipping upload routes without middleware or a policy
    mechanism: Handlers perform no authorization and routes.middleware defaults to [] — the endpoints are open to the internet unless you gate them.
    source: docs/uploads/direct-sessions.mdx (routes.middleware), docs/uploads/direct-upload-policy.mdx
    priority: CRITICAL
    skills: [media-uploads-resumable]
  - mistake: expecting bucket CORS to just work for direct uploads
    mechanism: The browser must read the ETag response header to confirm parts; without ExposeHeaders:["ETag"] every confirmation fails with an explicit xhrPartUploader message.
    source: docs/react/client.mdx (part transport), docs/uploads/direct-sessions.mdx warn callout
    priority: CRITICAL
    skills: [media-uploads-resumable]
  - mistake: forcing mode:direct on a disk without native multipart
    mechanism: direct is a requirement, auto is a preference — direct throws UploadNotSupportedError (mapped to 400) rather than silently downgrading.
    source: docs/uploads/upload-modes.mdx (Resolving the mode yourself)
    priority: MEDIUM
    skills: [media-uploads-resumable]
  - mistake: expecting a media record from policy-less direct completion
    mechanism: Without a DirectUploadPolicy, complete returns the raw assembled object and creates NO MediaRecord — adopting it is the caller's job.
    source: docs/uploads/direct-upload-policy.mdx (Without a policy)
    priority: HIGH
    skills: [media-uploads-resumable]
  - mistake: adding Authorization headers to presigned S3 part PUTs
    mechanism: headers/getHeaders apply to app requests only; an Authorization header on a presigned URL breaks the SigV4 signature.
    source: docs/react/index.mdx warn callout, docs/react/client.mdx warn callout
    priority: CRITICAL
    skills: [media-react-uploads]
  - mistake: passing meta.key to TUS or direct uploads expecting it honored
    mechanism: key (and disk) in UploadMeta apply to PROXY only — TUS/direct derive the key server-side, and meta.key is silently ignored there.
    source: docs/react/index.mdx (UploadMeta table)
    priority: HIGH
    skills: [media-react-uploads, media-uploads-resumable]
  - mistake: treating the TComplete generic as validation
    mechanism: TComplete is a type assertion over raw server JSON; nothing checks the shape — parse with a schema before trusting it.
    source: docs/react/index.mdx (typed completion body warn)
    priority: HIGH
    skills: [media-react-uploads]
  - mistake: sharing one storageKey between multiple uploaders
    mechanism: storageKey should be unique per upload slot — two uploaders sharing a key fight over the same localStorage entry; entries require matching fileName AND size to reuse.
    source: docs/react/index.mdx (Resuming a direct upload across a reload)
    priority: MEDIUM
    skills: [media-react-uploads]
  - mistake: setting concurrency expecting parallel direct-S3 parts
    mechanism: concurrency is reserved — direct-S3 uploads are sequential today; the option exists only for forward compatibility.
    source: docs/react/index.mdx (client options table)
    priority: MEDIUM
    skills: [media-react-uploads]
  - mistake: enabling dashboard actions without an auth gate
    mechanism: actions:true enables copy/move/delete/folder sweeps/record deletion; the routes are mounted regardless and refuse only via DashboardService's 403 — gate with middleware/auth first.
    source: docs/dashboard/index.mdx warn callout
    priority: CRITICAL
    skills: [media-dashboard-console]
  - mistake: registering both the embedded and standalone console providers
    mechanism: media_dashboard_provider (embedded) and @adonis-agora/media-dashboard's delegate provider must not both be registered — register exactly one.
    source: docs/dashboard/index.mdx (Standalone install)
    priority: MEDIUM
    skills: [media-dashboard-console]
  - mistake: assuming deleteMediaRecord removes the underlying object
    mechanism: DashboardService.deleteMediaRecord deletes the MediaStore row only — the disk object stays where it is.
    source: docs/dashboard/programmatic.mdx (Actions table)
    priority: HIGH
    skills: [media-dashboard-console]
  - mistake: configuring dashboard auth with neither a session nor a login hook
    mechanism: auth requires a non-empty secret AND at least one of session/login — anything else is a boot error by design (fail fast, not lock out).
    source: docs/dashboard/authentication.mdx
    priority: HIGH
    skills: [media-dashboard-console]
  - mistake: running expensive lookups in an objectInsights resolver
    mechanism: resolve runs on EVERY preview of EVERY object (providers run concurrently, failures skipped) — a fan-out there slows the whole lightbox.
    source: docs/dashboard/index.mdx (Object insights)
    priority: MEDIUM
    skills: [media-dashboard-console]

tensions:
  - name: streaming efficiency vs conversion capability
    skills: [media-uploads-resumable, media-library-collections]
    description: Zero-copy attach requires a known size AND no conversions; conversions need buffered bytes for the processor.
    implication: Agents "optimize" attach with size+stream on a converting collection and either get silent buffering anyway or break conversion generation.
  - name: explicit mode strictness vs auto convenience
    skills: [media-uploads-resumable, media-stores-delivery]
    description: direct throws on an incapable disk while auto silently downgrades; delivery auto degrades to signed rather than guessing public.
    implication: Agents pick one philosophy without seeing the other — expecting auto to throw (it won't) or direct to downgrade (it won't).
  - name: server-derived keys vs client flexibility
    skills: [media-react-uploads, media-uploads-resumable]
    description: Clients cannot choose keys (except proxy) because a client-chosen key is a hole; policies move key derivation fully server-side.
    implication: Agents building "flexible" clients pass keys in metadata or trust client input, reintroducing the vulnerability the design closes.
  - name: console power vs exposure surface
    skills: [media-dashboard-console, media-setup]
    description: The console's usefulness (actions, insights, breadth of disks) is configured entirely in config files that default to the safe side.
    implication: Agents flip actions:true/disks lists for capability and forget the gate that must come with it.

