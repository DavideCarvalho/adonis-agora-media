packages:
  - "packages/*"
# pnpm >= 10 nao roda build script de dependencia sem permissao explicita, e em CI ele
# ERRA (ERR_PNPM_IGNORED_BUILDS) em vez de so avisar -- o release morre no
# `pnpm install --frozen-lockfile` antes de chegar no changesets. Todos estes ja rodavam
# sob o pnpm 9 (biome/swc/esbuild/better-sqlite3/sharp compilam ou baixam binario), entao
# liberar preserva o comportamento; nao e permissao nova.
allowBuilds:
  '@biomejs/biome': true
  '@swc/core': true
  better-sqlite3: true
  esbuild: true
  # node-av (dependência do @mediabunny/server, só nos testes do engine mediabunny com ladder): o
  # addon nativo já vem pronto no pacote opcional @seydx/node-av-<plataforma>. Os scripts dele só
  # conferem a plataforma e baixam um binário de ffmpeg para o CLI próprio, que não usamos.
  node-av: false
  sharp: true
minimumReleaseAgeExclude:
  - '@adonis-agora/filter@1.0.0-rc.5 || 1.0.0'
  - '@adonis-agora/filter-client@1.0.0-rc.1 || 1.0.0'
  - '@adonis-agora/authkit-client@1.1.1'
  - '@adonis-agora/authkit-core@1.0.1'

# Intent (`intent validate`) typechecks the skill examples from the repo root, so their imports
# must resolve there: hoist the AdonisJS packages the library already depends on, so the examples
# load `HttpContext`, `router`, drive and lucid types from the same copies the library uses.
# Install-time only: no published package changes.
publicHoistPattern:
  - "@adonisjs/core"
  - "@adonisjs/drive"
  - "@adonisjs/lucid"
